name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Just for running commands
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Setup Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install frontend requirements
        run: bun install --frozen-lockfile
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # Keeps uv's download and build cache between runs, keyed on uv.lock.
          enable-cache: true
      - name: Install Python requirements
        run: uv sync --frozen
      - name: Run linting
        run: |
          PATH=$(pwd)/.venv/bin/:${PATH} just lint
        env:
          SECRET_KEY: secret-key-for-testing-only
          DEBUG: on
          PYTHON_CMD_PREFIX_WITH_DEPS: ""
          PYTHON_CMD_PREFIX: ""
          BUN_CMD_PREFIX: ""
  test:
    name: Tests
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: secret-key-for-testing-only
      READ_DOT_ENV_FILE: False
      DB_SSL_REQUIRED: False
      DATABASE_URL: postgres://postgres:postgres@172.17.0.1:5432/postgres
      # Same setup as the e2e job: just recipes run against an ephemeral web
      # container and forward the env vars Django needs to bootstrap settings.
      PYTHON_CMD_PREFIX: docker compose run -u root -e DATABASE_URL -e READ_DOT_ENV_FILE -e SECRET_KEY -e DB_SSL_REQUIRED --rm --no-deps web
      DOCKER_COMPOSE_PREFIX: docker compose run -u root -e DATABASE_URL -e READ_DOT_ENV_FILE -e SECRET_KEY -e DB_SSL_REQUIRED --rm --no-deps web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Just for running commands
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Match docker user to runner UID/GID
        # The bun container bind-mounts the workspace and writes to it, so it
        # needs the same UID/GID as the runner user that owns the files.
        run: |
          echo "HOST_UID=$(id -u)" >> $GITHUB_ENV
          echo "HOST_GID=$(id -g)" >> $GITHUB_ENV
      - name: Create empty .env (docker compose env_file requires the file to exist)
        run: touch .env
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build docker images
        # Builds compose.yml's web and frontend images and loads them for `docker compose run`. The layers are cached
        # in GitHub Actions' cache, one scope per image. This job writes the cache and the E2E job only reads it, so
        # the two jobs don't both upload the same layers.
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: compose.yml
          targets: web,frontend
          load: true
          set: |
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,scope=web,mode=max
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,scope=frontend,mode=max
      - name: Build frontend assets
        run: just build_frontend
      - name: Run the SPA's unit tests
        run: just test_js
      - name: Run tests
        run: ${{ env.DOCKER_COMPOSE_PREFIX }} pytest --cov --ds=config.settings.test_runner --durations=15 -n auto
  e2e:
    name: E2E tests
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: secret-key-for-testing-only
      READ_DOT_ENV_FILE: False
      DB_SSL_REQUIRED: False
      DATABASE_URL: postgres://postgres:postgres@172.17.0.1:5432/postgres
      # Override the default `docker compose exec web` so just recipes work
      # against an ephemeral container instead of expecting a running service,
      # and forward the env vars Django needs to bootstrap settings.
      PYTHON_CMD_PREFIX: docker compose run -u root -e DATABASE_URL -e READ_DOT_ENV_FILE -e SECRET_KEY -e DB_SSL_REQUIRED --rm --no-deps web
      DOCKER_COMPOSE_PREFIX: docker compose run -u root -e DATABASE_URL -e READ_DOT_ENV_FILE -e SECRET_KEY -e DB_SSL_REQUIRED --rm --no-deps web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Just for running commands
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Match docker user to runner UID/GID
        # The bun container bind-mounts the workspace and writes to it, so it
        # needs the same UID/GID as the runner user that owns the files.
        run: |
          echo "HOST_UID=$(id -u)" >> $GITHUB_ENV
          echo "HOST_GID=$(id -g)" >> $GITHUB_ENV
      - name: Create empty .env (docker compose env_file requires the file to exist)
        run: touch .env
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build dev docker image (includes Playwright browsers)
        # Reads the layer cache the Tests job writes (see its "Build docker images" step).
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: compose.yml
          targets: web,frontend
          load: true
          set: |
            web.cache-from=type=gha,scope=web
            frontend.cache-from=type=gha,scope=frontend
      - name: Build frontend assets
        run: just build_frontend
      - name: Run Playwright e2e tests
        run: ${{ env.DOCKER_COMPOSE_PREFIX }} pytest e2e/ --ds=config.settings.e2e --durations=15 -n auto
