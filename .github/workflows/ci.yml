name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Just for running commands
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Setup Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install frontend requirements
        run: bun install --frozen-lockfile
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # Keeps uv's download and build cache between runs, keyed on uv.lock.
          enable-cache: true
      - name: Install Python requirements
        run: uv sync --frozen
      - name: Run linting
        run: |
          PATH=$(pwd)/.venv/bin/:${PATH} just lint
        env:
          SECRET_KEY: secret-key-for-testing-only
          DEBUG: on
          PYTHON_CMD_PREFIX_WITH_DEPS: ""
          PYTHON_CMD_PREFIX: ""
          BUN_CMD_PREFIX: ""
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: secret-key-for-testing-only
      READ_DOT_ENV_FILE: False
      DB_SSL_REQUIRED: False
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Run the just recipes on the runner itself, not in the compose containers (see "Install Python requirements").
      PYTHON_CMD_PREFIX: ""
      PYTHON_CMD_PREFIX_WITH_DEPS: ""
      BUN_CMD_PREFIX: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Just for running commands
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Setup Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install Python requirements
        # The tests run on the runner, not in the web image: building that image takes 3-6 minutes whenever uv.lock
        # changes, while uv's cache makes this step take seconds. The Template workflow still builds and boots the
        # images.
        run: |
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install frontend requirements
        run: bun install --frozen-lockfile
      - name: Build frontend assets
        run: just build_frontend
      - name: Run the SPA's unit tests
        run: just test_js
      - name: Run tests
        run: pytest --cov --ds=config.settings.test_runner --durations=15 -n auto
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: secret-key-for-testing-only
      READ_DOT_ENV_FILE: False
      DB_SSL_REQUIRED: False
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Run the just recipes on the runner itself, not in the compose containers (see "Install Python requirements").
      PYTHON_CMD_PREFIX: ""
      PYTHON_CMD_PREFIX_WITH_DEPS: ""
      BUN_CMD_PREFIX: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Just for running commands
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Setup Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install Python requirements
        # The tests run on the runner, not in the web image: building that image takes 3-6 minutes whenever uv.lock
        # changes, while uv's cache makes this step take seconds. The Template workflow still builds and boots the
        # images.
        run: |
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install frontend requirements
        run: bun install --frozen-lockfile
      - name: Build frontend assets
        run: just build_frontend
      - name: Install Playwright's Chromium
        run: playwright install chromium --with-deps
      - name: Run Playwright e2e tests
        run: pytest e2e/ --ds=config.settings.e2e --durations=15 -n auto
