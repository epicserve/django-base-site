name: Template

# Template-only: checks that scripts/start_new_project produces a working project.
# `just clean_extra_files` deletes this file from new projects, which keep
# ci.yml (Lint, Tests, E2E tests) and dependabot.yml.

on:
  push:
    branches:
      - main
  pull_request:
    # It takes about 4 minutes, longer than ci.yml, so a pull request runs it only when it changes something this job
    # checks: the installer, the files it edits or deletes, the Docker images and compose stack it boots, and what
    # `just seed` runs. Every push to main runs it, which catches the rest, such as a new reference to a deleted file.
    paths:
      - .github/workflows/template.yml
      - scripts/**
      - config/**
      - justfile
      - compose.yml
      - .dockerignore
      - .env.toml
      - pyproject.toml
      - uv.lock
      - package.json
      - bun.lock
      - .gitignore
      - .githooks/**
      - .claude/**
      - .agents/**
      - AGENTS.md
      - apps/*/migrations/**
      - apps/*/management/**
      - apps/*/recipes.py
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install-script:
    runs-on: ubuntu-latest
    name: Tests install script
    env:
      BUILD_DIR: /home/runner/work/django-base-site/new_project/
      SECRET_KEY: secret-key-for-testing-only
      READ_DOT_ENV_FILE: on
      PYTHON_CMD_PREFIX: docker compose run -u root --rm --no-deps web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Just for running commands
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Match docker user to runner UID/GID
        # The bun container bind-mounts the workspace and writes to it, so it
        # needs the same UID/GID as the runner user that owns the files.
        run: |
          echo "HOST_UID=$(id -u)" >> $GITHUB_ENV
          echo "HOST_GID=$(id -g)" >> $GITHUB_ENV
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Test install script
        run: |
          ./scripts/start_new_project "example" ${GITHUB_REF#refs/heads/} 1 ${{ env.BUILD_DIR }}
      - name: Verify project files were updated correctly
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          echo "Verifying compose.yml was updated..."
          grep -q "image: example" compose.yml || (echo "ERROR: compose.yml not updated correctly" && exit 1)
          ! grep -q "image: epicserve/django-base-site" compose.yml || (echo "ERROR: compose.yml still contains template text" && exit 1)

          echo "Verifying justfile was updated..."
          grep -q "example" justfile || (echo "ERROR: justfile not updated correctly" && exit 1)

          echo "Verifying Dockerfile.web was updated..."
          grep -q "example" config/docker/Dockerfile.web || (echo "ERROR: Dockerfile.web not updated correctly" && exit 1)

          echo "All verification checks passed!"
      - name: Verify the new project keeps its CI and Dependabot config
        working-directory: ${{ env.BUILD_DIR }}
        # clean_extra_files used to delete all of .github/, so every new project
        # started with no CI and no Dependabot (#1358). Only this template-only
        # workflow should be removed, and ci.yml must not depend on the template.
        run: |
          test -f .github/workflows/ci.yml || { echo "ERROR: .github/workflows/ci.yml was removed"; exit 1; }
          test -f .github/dependabot.yml || { echo "ERROR: .github/dependabot.yml was removed"; exit 1; }
          test ! -e .github/workflows/template.yml || { echo "ERROR: the template-only workflow wasn't removed"; exit 1; }
          if grep -n "start_new_project" .github/workflows/ci.yml; then
            echo "ERROR: ci.yml references scripts/start_new_project, which new projects don't have"
            exit 1
          fi
      - name: Verify the template's docs-site tooling was removed
        working-directory: ${{ env.BUILD_DIR }}
        # docs/ is deleted from new projects, so its Zensical config and the
        # `just docs*` recipes that build it must go too, or they fail (#1358).
        run: |
          test ! -e zensical.toml || { echo "ERROR: zensical.toml was left behind without docs/"; exit 1; }
          test ! -e config/docs.just || { echo "ERROR: config/docs.just was left behind without docs/"; exit 1; }
          recipes=" $(just --summary) "
          for recipe in docs docs-build docs-lint lint_docs; do
            if [[ "${recipes}" == *" ${recipe} "* ]]; then
              echo "ERROR: 'just ${recipe}' still exists but docs/ was deleted"
              exit 1
            fi
          done
          # Its dev dependencies go too, and uv.lock must still match pyproject.toml.
          if grep -nE '"(zensical|mkdocs-linkcheck)' pyproject.toml uv.lock; then
            echo "ERROR: the docs site's dev dependencies were left in pyproject.toml or uv.lock"
            exit 1
          fi
          uv lock --check
      - name: Verify AGENTS.md only points at things the new project has
        working-directory: ${{ env.BUILD_DIR }}
        # AGENTS.md is the first file an agent reads in a new project. It used to
        # link to the deleted docs/ and document the deleted `just docs*` recipes
        # (#1358). Template-only content goes between template-only markers,
        # which clean_extra_files strips.
        run: |
          status=0
          if grep -n "template-only:" AGENTS.md; then
            echo "ERROR: template-only markers are left in AGENTS.md"
            status=1
          fi
          # Every relative Markdown link must resolve.
          while IFS= read -r target; do
            [ -e "${target%%#*}" ] || { echo "ERROR: AGENTS.md links to a missing path: ${target}"; status=1; }
          done < <(grep -oE '\]\([^)]+\)' AGENTS.md | sed -E 's/^\]\((.*)\)$/\1/' | grep -vE '^(https?:|mailto:|#)' | sort -u)
          # Every `just <recipe>` it mentions must exist.
          recipes=" $(just --summary) "
          while IFS= read -r recipe; do
            [[ "${recipes}" == *" ${recipe} "* ]] || { echo "ERROR: AGENTS.md mentions 'just ${recipe}', which doesn't exist"; status=1; }
          done < <(grep -oE '`just [a-z0-9_-]+' AGENTS.md | sed 's/^`just //' | sort -u)
          exit ${status}
      - name: Verify nothing else points at the template's deleted files
        working-directory: ${{ env.BUILD_DIR }}
        # clean_extra_files used to survive in new projects (failing on re-run
        # because scripts/start_new_project was already gone), and comments and
        # help text pointed at README.md and docs/*.md. Matches only bare paths:
        # URLs such as https://bun.sh/docs/ are preceded by a slash and skipped.
        run: |
          if grep -rnIE '(^|[^[:alnum:]/._-])(docs/|README\.md|CHANGELOG\.md|LICENSE\.md|\.readthedocs\.yaml|zensical|mkdocs|start_new_project|clean_extra_files|template\.yml|template-only)' \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv .; then
            echo "ERROR: the lines above refer to template-only files that new projects don't have"
            exit 1
          fi
      - name: Verify third-party compose images can still be pulled
        working-directory: ${{ env.BUILD_DIR }}
        # Guards against an upstream image vanishing from its registry, which
        # breaks `just init` for every new project (#1345: MinIO removed
        # minio/minio from Docker Hub). Images built from this repo are skipped
        # because they're never pulled.
        run: |
          docker compose config --format json \
            | jq -r '[.services[] | select(.build) | .image] as $built | [.services[] | .image] - $built | unique[]' \
            | while read -r image; do
                echo "Checking ${image} ..."
                docker manifest inspect "${image}" > /dev/null || { echo "ERROR: ${image} can't be pulled"; exit 1; }
              done
      - name: Verify just init survives a project that isn't a Git repository yet
        working-directory: ${{ env.BUILD_DIR }}
        # start_new_project produces a plain directory (no .git/), and `just init`
        # runs `install_hooks` first. It used to abort there with
        # "fatal: not in a git directory"; it must skip the hooks with a note
        # instead, and still install them once the project has been `git init`-ed.
        run: |
          test ! -e .git || { echo "ERROR: expected a fresh project without .git"; exit 1; }
          # `just doctor` reads the URLs from scripts/worktree, so it has to work before `git init` too.
          output=$(scripts/worktree urls) || { echo "ERROR: scripts/worktree urls failed without a Git repository"; exit 1; }
          echo "${output}" | grep -q '^App: *http://localhost:8000/$' \
            || { echo "ERROR: expected the app on port 8000 without a Git repository:"; echo "${output}"; exit 1; }
          output=$(just install_hooks 2>&1) || { echo "ERROR: just install_hooks failed without a Git repository:"; echo "${output}"; exit 1; }
          echo "${output}"
          echo "${output}" | grep -q "Skipping Git hooks" || { echo "ERROR: expected install_hooks to print its skip note"; exit 1; }
          git init -q .
          just install_hooks
          test "$(git config core.hooksPath)" = ".githooks" || { echo "ERROR: core.hooksPath was not set after git init"; exit 1; }
      - name: Verify the new project commits its Claude Code permission rules
        working-directory: ${{ env.BUILD_DIR }}
        # .claude/settings.json makes Claude Code refuse or ask before commands that destroy local data. .gitignore
        # ignores the rest of .claude/, so without its exception for this file a new project's first `git add .` would
        # leave the rules out, with nothing to say so. .claude/settings.local.json is each developer's own and stays out.
        # pytest can't check this: the web container has no git. core.excludesFile=/dev/null leaves out any global
        # excludes file, so only the project's .gitignore decides.
        run: |
          jq -e '.permissions.deny and .permissions.ask' .claude/settings.json > /dev/null \
            || { echo "ERROR: .claude/settings.json is missing, isn't valid JSON, or has no deny and ask rules"; exit 1; }
          if git -c core.excludesFile=/dev/null check-ignore -q .claude/settings.json; then
            echo "ERROR: .gitignore ignores .claude/settings.json, so the new project wouldn't commit it"
            exit 1
          fi
          git -c core.excludesFile=/dev/null check-ignore -q .claude/settings.local.json \
            || { echo "ERROR: .gitignore doesn't ignore .claude/settings.local.json"; exit 1; }
      - name: Verify scripts/worktree urls refuses a worktree that wasn't set up
        working-directory: ${{ env.BUILD_DIR }}
        # A worktree made with `git worktree add` (as Claude Code's own worktrees are) skips Worktrunk's hooks, so it
        # has no .env. `scripts/worktree urls` used to print the default ports there with no warning, and the run-app
        # skill fell back to 8000 too. Those are the main checkout's ports, so an agent checked main's running stack in
        # place of the branch's. The project has no commit yet, so make one to branch from. --no-verify skips the
        # pre-commit hook, which formats with tools this job hasn't installed; the commit never leaves the runner.
        run: |
          git add -A
          git -c user.name=CI -c user.email=ci@example.com commit -q --no-verify -m "Initial commit"
          output=$(scripts/worktree urls) || { echo "ERROR: scripts/worktree urls failed in the main checkout"; exit 1; }
          echo "${output}" | grep -q '^App: *http://localhost:8000/$' \
            || { echo "ERROR: expected the main checkout's app on port 8000:"; echo "${output}"; exit 1; }
          git worktree add -q ../no-setup -b no-setup
          if output=$(cd ../no-setup && scripts/worktree urls 2>&1); then
            echo "ERROR: scripts/worktree urls succeeded in a worktree that was never set up:"
            echo "${output}"
            exit 1
          fi
          echo "${output}"
          echo "${output}" | grep -q "scripts/worktree setup" \
            || { echo "ERROR: expected the error to say to run scripts/worktree setup"; exit 1; }
          git worktree remove ../no-setup
          git branch -q -D no-setup
      - name: Verify concurrent scripts/worktree setups choose different ports
        working-directory: ${{ env.BUILD_DIR }}
        # Two worktrees set up seconds apart (parallel agents running `wt switch --create`) both got the same web and
        # debugpy ports: each chose its ports before the other had written its .env. Run several setups at once and
        # check that no two worktrees share a port. A docker that always fails stands in for the real one, so setup
        # skips the volume copy (which needs the images this job hasn't built yet) and only chooses ports.
        run: |
          mkdir -p ../race-bin
          printf '#!/bin/sh\nexit 1\n' > ../race-bin/docker
          chmod +x ../race-bin/docker
          count=6
          for i in $(seq 1 ${count}); do git worktree add -q "../race-${i}" -b "race-${i}"; done
          pids=()
          for i in $(seq 1 ${count}); do
            (cd "../race-${i}" && PATH="$(cd ../race-bin && pwd):${PATH}" scripts/worktree setup > ../race-${i}.log 2>&1) &
            pids+=($!)
          done
          status=0
          for i in $(seq 1 ${count}); do
            wait "${pids[$((i - 1))]}" || { echo "ERROR: scripts/worktree setup failed in race-${i}:"; cat "../race-${i}.log"; status=1; }
            grep -q '^HOST_PORT_WEB=' "../race-${i}/.env" 2>/dev/null \
              || { echo "ERROR: race-${i} has no HOST_PORT_WEB in its .env"; status=1; }
          done
          for i in $(seq 1 ${count}); do echo "race-${i}: $(grep -h '^HOST_PORT_' "../race-${i}/.env" 2>/dev/null | xargs)"; done
          duplicates=$(for i in $(seq 1 ${count}); do sed -n 's/^HOST_PORT_[A-Z0-9_]*=//p' "../race-${i}/.env" 2>/dev/null; done | sort | uniq -d)
          [ -z "${duplicates}" ] || { echo "ERROR: more than one worktree got port(s): $(echo ${duplicates})"; status=1; }
          for i in $(seq 1 ${count}); do git worktree remove --force "../race-${i}"; git branch -q -D "race-${i}"; done
          rm -rf ../race-bin ../race-*.log
          exit ${status}
      - name: Build docker images
        working-directory: ${{ env.BUILD_DIR }}
        run: docker compose build web frontend
      - name: Build assets
        working-directory: ${{ env.BUILD_DIR }}
        run: just build_frontend
      - name: Boot the new project and check the app responds
        working-directory: ${{ env.BUILD_DIR }}
        # Smoke-tests what the installer produced, started the way a user starts
        # it: the generated .env, the compose services and their healthchecks,
        # and web's startup (migrate + ensure_s3_bucket against Silo). The
        # project's code itself is tested by ci.yml's Tests job, so pytest
        # doesn't run here. ci.yml runs on the runner, not in these images, so
        # this is the only job that builds and boots them. web has no healthcheck, so poll the API until it
        # answers.
        run: |
          docker compose up --wait -d web || { docker compose ps; docker compose logs; exit 1; }
          for attempt in $(seq 1 60); do
            if curl -fs -o /dev/null http://localhost:8000/api/app-context/; then
              echo "The app responded after ${attempt} attempt(s)"
              exit 0
            fi
            if [ -z "$(docker compose ps --status running -q web)" ]; then
              echo "ERROR: the web container stopped before the app responded"
              docker compose ps -a
              docker compose logs web
              exit 1
            fi
            sleep 2
          done
          echo "ERROR: /api/app-context/ didn't respond within 2 minutes"
          docker compose ps -a
          docker compose logs web
          exit 1
      - name: Verify just doctor fails before just seed, and names it
        working-directory: ${{ env.BUILD_DIR }}
        # `just doctor` tells an agent whether the stack is ready to drive (#1424). It needs every service, so start
        # the rest of the stack. With everything up but nothing seeded, the seed check is the only one that may fail.
        run: |
          docker compose up --wait -d || { docker compose ps -a; docker compose logs; exit 1; }
          for attempt in $(seq 1 60); do curl -fs -o /dev/null http://localhost:8000/api/app-context/ && break; sleep 2; done
          if output=$(just doctor 2>&1); then
            echo "${output}"
            echo "ERROR: just doctor passed before just seed ran"
            exit 1
          fi
          echo "${output}"
          echo "${output}" | grep -q "Run just seed." || { echo "ERROR: expected just doctor to say to run just seed"; exit 1; }
          failures=$(echo "${output}" | grep -c "✗" || true)
          [ "${failures}" = 1 ] || { echo "ERROR: expected only the seed check to fail, but ${failures} did"; exit 1; }
      - name: Seed the new project and sign in as seeded users
        working-directory: ${{ env.BUILD_DIR }}
        # `just seed` gives agents known logins to check UI changes with (#1365).
        # pytest covers the seed command itself; this covers what it can't: the recipe,
        # the compose prefix, DEBUG being on in the generated .env (the command
        # refuses to run otherwise), and the superuser fallbacks epicenv writes to
        # .env when there's no 1Password (the command refuses blank ones). The
        # second run must succeed against the data the first one created.
        run: |
          just seed || { docker compose logs web; exit 1; }
          just seed || { echo "ERROR: just seed failed when rerun"; docker compose logs web; exit 1; }
          sign_in() {
            status=$(curl -s -o /tmp/login.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -d "$(jq -n --arg email "$1" --arg password "$2" '{email: $email, password: $password}')" \
              http://localhost:8000/_allauth/app/v1/auth/login)
            if [ "${status}" != "200" ]; then
              echo "ERROR: signing in as $1 returned ${status}:"
              cat /tmp/login.json
              docker compose logs web
              exit 1
            fi
            echo "Signed in as $1"
          }
          sign_in owner@example.com dev-password
          sign_in "$(sed -n 's/^DJANGO_SUPERUSER_EMAIL=//p' .env)" "$(sed -n 's/^DJANGO_SUPERUSER_PASSWORD=//p' .env)"
      - name: Verify just doctor passes, and refuses a worktree that wasn't set up
        working-directory: ${{ env.BUILD_DIR }}
        # In a worktree made with `git worktree add`, which skips Worktrunk's hooks, the ports would be the main
        # checkout's, so doctor would check the main checkout's healthy stack in place of the worktree's. It has to
        # fail there before checking anything.
        run: |
          just doctor || { docker compose ps -a; docker compose logs; exit 1; }
          git worktree add -q ../doctor-no-setup -b doctor-no-setup
          if output=$(cd ../doctor-no-setup && just doctor 2>&1); then
            echo "${output}"
            echo "ERROR: just doctor passed in a worktree that was never set up"
            exit 1
          fi
          echo "${output}"
          echo "${output}" | grep -q "scripts/worktree setup" \
            || { echo "ERROR: expected just doctor to say to run scripts/worktree setup"; exit 1; }
          if echo "${output}" | grep -q "is running"; then
            echo "ERROR: just doctor checked the main checkout's services from the worktree"
            exit 1
          fi
          git worktree remove ../doctor-no-setup
          git branch -q -D doctor-no-setup
      - name: Verify just clean_docker_containers removes only this project's containers
        working-directory: ${{ env.BUILD_DIR }}
        # It used to kill and remove every container on the machine. A container from outside the project, started
        # from an image the project already pulled, has to survive it, and the project's own containers have to go.
        run: |
          docker run -d --name bystander "$(docker compose config --images | grep -m1 redis)"
          just clean_docker_containers
          project=$(docker compose config | sed -n 's/^name: //p')
          if [ -n "$(docker ps -aq --filter "label=com.docker.compose.project=${project}")" ]; then
            echo "ERROR: just clean_docker_containers left some of the project's containers:"
            docker ps -a --filter "label=com.docker.compose.project=${project}"
            exit 1
          fi
          if [ "$(docker inspect -f '{{.State.Running}}' bystander 2>/dev/null)" != "true" ]; then
            echo "ERROR: just clean_docker_containers stopped or removed a container from outside the project"
            exit 1
          fi
          docker rm --force bystander
