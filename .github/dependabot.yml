# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2

updates:
  - package-ecosystem: "docker"
    directory: "/config/docker/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "11:00" # 11 AM UTC / 5 AM CST

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "11:00" # 11 AM UTC / 5 AM CST
    ignore:
      # Major database upgrades need a migration plan; only surface minors/patches.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "11:00" # 11 AM UTC / 5 AM CST
    open-pull-requests-limit: 10
    groups:
      uv-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "11:00" # 11 AM UTC / 5 AM CST
    ignore:
      # openapi-typescript (`just generate_api_types`) needs TypeScript's JS compiler API and its peer range is
      # `typescript: ^5.x`; TypeScript 7 is the Go port and has no JS API. Drop this once openapi-typescript's peer
      # range takes a newer major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: "saturday"
      time: "11:00" # 11 AM UTC / 5 AM CST
