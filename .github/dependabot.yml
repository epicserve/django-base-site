# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2

updates:
  - package-ecosystem: "docker"
    directory: "/config/docker/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "11:00" # 11 AM UTC / 5 AM CST

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "11:00" # 11 AM UTC / 5 AM CST
    ignore:
      # Major database upgrades need a migration plan; only surface minors/patches.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "11:00" # 11 AM UTC / 5 AM CST
    open-pull-requests-limit: 10
    # Match pyproject.toml's `exclude-newer = "P7D"`: uv won't lock a release less than 7 days old.
    cooldown:
      default-days: 7
    groups:
      uv-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "11:00" # 11 AM UTC / 5 AM CST
    ignore:
      # TypeScript 7 is the Go port and has no JavaScript compiler API, which openapi-typescript (`just
      # generate_api_types`) and vue-tsc (`just lint_ts`) both load; 7.0.2 crashes both. TypeScript 6 still has the
      # API. Drop this once both tools support 7. openapi-typescript's peer range is `^5.x`, but 6.0.3 generates the
      # same types, and `just lint_api_types` fails if a TypeScript update changes them.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: "saturday"
      time: "11:00" # 11 AM UTC / 5 AM CST
